<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduGenie — AI Learning Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">EDUGENIE</p>
        <h1>Learn smarter with Gemini.</h1>
        <p class="subtitle">Ask questions, simplify concepts, summarize notes, generate quizzes, and build a learning path.</p>
      </div>
      <div class="status" id="status">Ready</div>
    </header>

    <section class="card">
      <label for="task">Choose a task</label>
      <select id="task">
        <option value="qa">Q&amp;A</option>
        <option value="explain">Explain</option>
        <option value="quiz">Generate Quiz</option>
        <option value="summarize">Summarize</option>
        <option value="learn">Recommend Learning Path</option>
      </select>

      <div class="grid" id="options">
        <div>
          <label for="level">Learner level</label>
          <select id="level">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
        <div id="weeksWrap" class="hidden">
          <label for="weeks">Weeks</label>
          <input id="weeks" type="number" min="1" max="52" value="6">
        </div>
        <div id="countWrap" class="hidden">
          <label for="count">Questions</label>
          <input id="count" type="number" min="1" max="10" value="3">
        </div>
      </div>

      <label for="inputText" id="inputLabel">Your question</label>
      <textarea id="inputText" rows="10" placeholder="Example: What is the largest ocean?"></textarea>
      <button id="submitBtn">Run EduGenie</button>
    </section>

    <section class="card result-card">
      <div class="result-head">
        <h2>Result</h2>
        <button class="secondary" id="copyBtn" disabled>Copy</button>
      </div>
      <div id="result" class="result muted">Your answer will appear here.</div>
    </section>

    <footer>EduGenie • FastAPI + Google Gemini • Built for learning</footer>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
